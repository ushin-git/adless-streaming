name: Signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.0.0
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ADLESS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Configure ADLESS_RELEASE_KEYSTORE_BASE64 first."; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/adless-release.jks"
      - name: Build signed release APK
        env:
          ADLESS_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/adless-release.jks
          ADLESS_RELEASE_STORE_PASSWORD: ${{ secrets.ADLESS_RELEASE_STORE_PASSWORD }}
          ADLESS_RELEASE_KEY_ALIAS: ${{ secrets.ADLESS_RELEASE_KEY_ALIAS }}
          ADLESS_RELEASE_KEY_PASSWORD: ${{ secrets.ADLESS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: adless-streaming-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
